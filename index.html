<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ShuttleWise</title>
    <script>
      try {
        const theme = localStorage.getItem('shuttlewise-theme')
        if (theme === 'dark') document.documentElement.dataset.studentTheme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
